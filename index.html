<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7efe4" />
    <title>万物皆可撸 · Pet Everything</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23ffd9c2'/%3E%3Cpath d='M20 31c-6-4-11-8-11-13a5.5 5.5 0 0 1 11-2 5.5 5.5 0 0 1 11 2c0 5-5 9-11 13Z' fill='%23ff5f86'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <div id="stage" tabindex="0" role="application" aria-label="抚摸区域。移动鼠标或手指来抚摸，按住空格自动抚摸，左右方向键切换动物。">
        <canvas id="scene" aria-hidden="true"></canvas>
      </div>
      <div class="corner top-right">
        <button id="sound" class="icon-button" role="switch" aria-checked="true" aria-label="声音">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
            <path class="cross" d="m16 9.5 5 5m0-5-5 5" />
          </svg>
        </button>
        <button id="full" class="icon-button" aria-label="全屏" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="enter" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" />
            <path class="exit" d="M4 9h5V4m6 0v5h5M4 15h5v5m6 0v-5h5" />
          </svg>
        </button>
      </div>
      <nav class="dock" aria-label="选择动物">
        <div id="variants" class="variants" role="radiogroup" aria-label="毛色"></div>
        <div id="pets" class="pets" role="radiogroup" aria-label="动物"></div>
      </nav>
      <p id="status" class="sr" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
